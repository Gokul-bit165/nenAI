name: nenai
description: "NENAI – Privacy-first offline AI memory app. All processing runs on-device."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # ── On-device LLM ─────────────────────────────────────────────────────────
  flutter_gemma: ^1.4.2

  # ── Embeddings via ONNX Runtime ───────────────────────────────────────────
  flutter_onnxruntime: ^1.5.1

  # ── Local database (Drift = Room equivalent for Flutter) ──────────────────
  drift: ^2.14.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.18

  # ── Dependency injection ───────────────────────────────────────────────────
  get_it: ^7.6.0

  # ── State management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^13.0.0

  # ── Background processing ─────────────────────────────────────────────────
  workmanager: ^0.10.0

  # ── Utilities ─────────────────────────────────────────────────────────────
  path_provider: ^2.1.2
  path: ^1.8.3
  uuid: ^4.2.1
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  http: ^1.2.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # ── Code generation ───────────────────────────────────────────────────────
  build_runner: ^2.4.8
  drift_dev: ^2.14.0
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true

  assets:
    - assets/models/
